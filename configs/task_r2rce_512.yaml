ENVIRONMENT:
  MAX_EPISODE_STEPS: 500
  MAX_EPISODE_SECONDS: 2400
  ITERATOR_OPTIONS:
    CYCLE: False
    SHUFFLE: False
    GROUP_BY_SCENE: False

SIMULATOR:
  TYPE: Sim-v1
  ACTION_SPACE_CONFIG: v1
  FORWARD_STEP_SIZE: 0.25
  TURN_ANGLE: 15
  TILT_ANGLE: 30
  AGENT_0:
    SENSORS: [RGB_SENSOR]
    HEIGHT: 0.88
    RADIUS: 0.1
  HABITAT_SIM_V0:
    GPU_DEVICE_ID: 0
    ALLOW_SLIDING: True
  RGB_SENSOR:
    UUID: rgb
    TYPE: HabitatSimRGBSensor
    WIDTH: 512
    HEIGHT: 512
    HFOV: 79
    POSITION: [0, 0.88, 0]

TASK:
  TYPE: VLN-v0
  SUCCESS_DISTANCE: 3.0
  SENSORS: [INSTRUCTION_SENSOR]
  INSTRUCTION_SENSOR_UUID: instruction
  POSSIBLE_ACTIONS: [STOP, MOVE_FORWARD, TURN_LEFT, TURN_RIGHT, LOOK_UP, LOOK_DOWN]
  MEASUREMENTS: [
    DISTANCE_TO_GOAL,
    SUCCESS,
    SPL,
    ORACLE_SUCCESS,
    PATH_LENGTH,
    STEPS_TAKEN,
    POSITION,
  ]
  SUCCESS:
    SUCCESS_DISTANCE: 3.0
  SPL:
    SUCCESS_DISTANCE: 3.0
  ORACLE_SUCCESS:
    SUCCESS_DISTANCE: 3.0
  DISTANCE_TO_GOAL:
    DISTANCE_TO: POINT

DATASET:
  TYPE: VLN-CE-v1
  SPLIT: val_unseen
  DATA_PATH: data/datasets/R2R_VLNCE_v1-3_preprocessed/{split}/{split}.json.gz
  SCENES_DIR: data/scene_datasets/
  CONTENT_SCENES: ["*"]
  EPISODES_ALLOWED: null
